# =============================================================================
# General
# =============================================================================

start-at-login = true

# Mouse follows focus — cursor jumps to the focused window
# so you always know which window is active
on-focus-changed = ['move-mouse window-lazy-center']

# Automatically flatten nested containers to avoid confusing deep layouts
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-orientation = 'auto'
default-root-container-layout = 'tiles'

# Borders (FelixKratz)
# github.com/FelixKratz/JankyBorders
after-startup-command = [
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0'
]

# Gap between tiled windows (pixels)
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.top = 2
outer.bottom = 10
outer.left = 10
outer.right = 10

# =============================================================================
# Key Bindings — Main Mode
# =============================================================================
# alt (Option) is the modifier for everything.
# alt+l is usable because the custom "German @Q" layout (keyboard/GermanAtQ.keylayout)
# moves @ from alt+l to alt+q.

[mode.main.binding]

# Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Layout
# All windows float by default (see Window Rules); AeroSpace is mainly used for
# workspaces. Focus/move/resize/accordion only apply to tiled windows.
# Toggle between tiling and accordion layout
alt-comma = 'layout tiles accordion'

# Toggle floating (untiled, free-moving) vs tiled
alt-shift-space = 'layout floating tiling'

# Toggle maximize: floating windows fill the screen (with gaps), alt-f again restores
# the previous size/position; tiled windows toggle fullscreen
alt-f = 'exec-and-forget ~/dev/config/aerospace/toggle-maximize.sh'

# Toggle all windows on the current workspace: float all if any is tiled, otherwise tile all
alt-shift-f = ['exec-and-forget if aerospace list-windows --workspace focused --format %{window-layout} | grep -qv floating; then t=floating; else t=tiling; fi; aerospace list-windows --workspace focused --format %{window-id} | xargs -I{} aerospace layout --window-id {} $t']


# Reload config
alt-shift-r = 'reload-config'

# Enter resize mode (Escape to exit)
alt-r = 'mode resize'

# =============================================================================
# Workspaces
# =============================================================================
# alt + key = switch to workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-d = 'workspace D'    # Dev tools
alt-w = 'workspace W'    # Work

# alt+shift + key = move focused window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-d = 'move-node-to-workspace D'
alt-shift-w = 'move-node-to-workspace W'

# =============================================================================
# Resize Mode
# =============================================================================
# After alt+r, use h/j/k/l (or arrow keys) to resize. Escape/Enter to exit.

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
left = 'resize width -50'
down = 'resize height +50'
up = 'resize height -50'
right = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

# =============================================================================
# Window Rules
# =============================================================================
# Only the first matching rule runs, so app-specific rules must include
# 'layout floating' themselves and the catch-all must stay last.

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = ['layout floating', 'move-node-to-workspace D']

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = ['layout floating', 'move-node-to-workspace W']

# Everything else floats (free move/overlap, no auto-tiling)
[[on-window-detected]]
run = 'layout floating'
